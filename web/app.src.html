<title>FIO Wallet Demo</title>
<meta name="theme-color" content="#121117">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: one phone-sized app; full-bleed on phones, framed device on larger screens. Single dark brand look. */
:root{
  --bg:#121117; --bg-2:#17161B; --ink:#FFFFFF; --muted:rgba(255,255,255,.66); --faint:rgba(255,255,255,.42);
  --glass:rgba(255,255,255,.065); --glass-2:rgba(255,255,255,.10); --line:rgba(255,255,255,.12); --line-2:rgba(255,255,255,.2);
  --purple:#765CD6; --purple-d:#4C3A8F; --lilac:#B9A6FA; --lilac-2:#D6CBFF;
  --mint:#6BEFB7; --mint-t:#8FF5C9; --pink:#F1BBF2; --yellow:#FDFF9B; --rose:#FF9EAE;
  --font:"Montserrat", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --r-lg:28px; --r-md:20px; --r-sm:14px;
  --ease:cubic-bezier(.2,.8,.2,1);
  color-scheme:dark;
}
html,body{height:100%}
body{margin:0;background:#0B0A0F;color:var(--ink);font-family:var(--font);-webkit-font-smoothing:antialiased;display:flex;align-items:center;justify-content:center;overflow:hidden}
*{box-sizing:border-box}
button,input,textarea{font-family:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--lilac);outline-offset:2px}

.device{position:relative;width:100%;height:100%;max-width:480px;overflow:hidden;background:var(--bg);isolation:isolate}
@media (min-width:640px) and (min-height:760px){
  .device{width:390px;height:844px;border-radius:52px;box-shadow:0 0 0 10px #1d1c22,0 0 0 11px #2c2b33,0 40px 120px rgba(0,0,0,.6)}
}
.mesh{position:absolute;inset:-20%;z-index:0;pointer-events:none;
  background:radial-gradient(40% 30% at 10% 8%,rgba(118,92,214,.42),transparent 70%),
             radial-gradient(35% 25% at 95% 40%,rgba(241,187,242,.09),transparent 70%),
             radial-gradient(40% 30% at 10% 100%,rgba(107,239,183,.10),transparent 70%);
  animation:drift 18s ease-in-out infinite alternate}
@keyframes drift{to{transform:translate(4%,3%) scale(1.06)}}

.stage{position:absolute;inset:0;z-index:1}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;overflow-y:auto;overflow-x:hidden;padding:22px 20px 28px;scrollbar-width:none}
.screen::-webkit-scrollbar{display:none}
.screen>*{flex-shrink:0}
.screen.has-tabs{padding-bottom:calc(124px + env(safe-area-inset-bottom,0px))}
.enter-fwd{animation:inFwd .42s var(--ease) both}
.enter-back{animation:inBack .42s var(--ease) both}
.enter-fade{animation:fadeIn .32s ease both}
.leave{animation:fadeOut .22s ease both;pointer-events:none}
@keyframes inFwd{from{opacity:0;transform:translateX(36px)}to{opacity:1;transform:none}}
@keyframes inBack{from{opacity:0;transform:translateX(-36px)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes fadeOut{to{opacity:0}}
.stagger>*{animation:fadeIn .5s var(--ease) both}
.stagger>*:nth-child(2){animation-delay:.05s}.stagger>*:nth-child(3){animation-delay:.1s}.stagger>*:nth-child(4){animation-delay:.15s}
.stagger>*:nth-child(5){animation-delay:.2s}.stagger>*:nth-child(6){animation-delay:.25s}.stagger>*:nth-child(7){animation-delay:.3s}.stagger>*:nth-child(n+8){animation-delay:.35s}

/* type */
h1{margin:0;font-size:28px;line-height:1.25;font-weight:700;letter-spacing:-.3px;text-wrap:balance}
h2{margin:0;font-size:20px;font-weight:700;letter-spacing:-.2px}
p{margin:0}
.lead{font-size:15px;line-height:1.55;color:var(--muted)}
.small{font-size:13px;line-height:1.45;color:var(--muted)}
.eyebrow{font-size:11.5px;font-weight:600;letter-spacing:1.8px;text-transform:uppercase;color:var(--faint)}
.at{color:var(--lilac)}
.num{font-variant-numeric:tabular-nums}

/* components */
.glass{background:var(--glass);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:inset 0 1px 0 rgba(255,255,255,.1),0 18px 40px rgba(0,0,0,.28);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;height:56px;border-radius:28px;border:0;font-size:16px;font-weight:600;width:100%;transition:transform .15s var(--ease),filter .2s,opacity .2s;text-decoration:none;color:var(--ink)}
.btn:active{transform:scale(.97)}
.btn.primary{background:linear-gradient(135deg,#7A60DA,#4C3A8F);box-shadow:inset 0 1px 0 rgba(255,255,255,.22),0 14px 34px rgba(118,92,214,.35)}
.btn.ghost{background:var(--glass);border:1px solid var(--line)}
.btn.mint{background:linear-gradient(135deg,#5BD9A3,#2E9E73);color:#06231A;box-shadow:0 14px 34px rgba(107,239,183,.22)}
.btn[disabled]{opacity:.38;pointer-events:none}
.btn.sm{height:44px;font-size:14px;border-radius:22px;width:auto;padding:0 18px}
.iconbtn{width:44px;height:44px;border-radius:22px;display:flex;align-items:center;justify-content:center;background:var(--glass);border:1px solid var(--line);flex:none;position:relative}
.iconbtn:active{transform:scale(.94)}
.topbar{display:flex;align-items:center;gap:12px;min-height:44px}
.topbar h2{flex:1}
.spacer{flex:1}
.stack{display:flex;flex-direction:column}
.row{display:flex;align-items:center}
.gap-4{gap:4px}.gap-8{gap:8px}.gap-12{gap:12px}.gap-16{gap:16px}.gap-20{gap:20px}.gap-24{gap:24px}
.mt-8{margin-top:8px}.mt-12{margin-top:12px}.mt-16{margin-top:16px}.mt-20{margin-top:20px}.mt-24{margin-top:24px}.mt-32{margin-top:32px}.mt-auto{margin-top:auto}
.pill{display:inline-flex;align-items:center;gap:8px;height:30px;padding:0 12px;border-radius:15px;font-size:12.5px;font-weight:600;white-space:nowrap}
.pill.ok{background:rgba(107,239,183,.12);border:1px solid rgba(107,239,183,.4);color:var(--mint-t)}
.pill.warn{background:rgba(255,158,174,.10);border:1px solid rgba(255,158,174,.4);color:var(--rose)}
.pill.lilac{background:rgba(160,138,238,.16);border:1px solid rgba(185,166,250,.35);color:var(--lilac-2)}
.pill.dim{background:var(--glass);border:1px solid var(--line);color:var(--muted)}
.pill.soon{background:rgba(253,255,155,.08);border:1px solid rgba(253,255,155,.35);color:var(--yellow)}
.field{display:flex;align-items:center;gap:10px;height:58px;border-radius:var(--r-md);padding:0 16px;background:var(--glass);border:1.5px solid var(--line);transition:border-color .2s,box-shadow .2s}
.field:focus-within{border-color:var(--lilac);box-shadow:0 0 0 4px rgba(185,166,250,.14)}
.field input{flex:1;min-width:0;height:100%;border:0;outline:0;background:transparent;font-size:17px;font-weight:600}
.field input::placeholder{color:var(--faint);font-weight:500}
.label{font-size:11.5px;font-weight:600;letter-spacing:1.8px;text-transform:uppercase;color:var(--faint)}
.list{border-radius:var(--r-lg);padding:4px 16px}
.li{display:flex;align-items:center;gap:14px;min-height:64px;border-bottom:1px solid rgba(255,255,255,.07);width:100%;background:none;border-left:0;border-right:0;border-top:0;text-align:left;padding:0}
.li:last-child{border-bottom:0}
.li .t{font-weight:600;font-size:15px}
.li .s{font-size:12.5px;color:var(--muted);margin-top:2px}
.coin{width:40px;height:40px;border-radius:20px;flex:none;object-fit:cover}
.coin.sm{width:28px;height:28px}
.avatar{width:40px;height:40px;border-radius:20px;flex:none;display:flex;align-items:center;justify-content:center;font-weight:700;color:#17161B;font-size:16px;text-transform:uppercase}
.fiocoin{display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#2a2440,#1b1928);border:1px solid rgba(185,166,250,.35)}
.fiocoin img{height:60%}
.chev{color:var(--faint);flex:none}
.switch{appearance:none;-webkit-appearance:none;width:50px;height:30px;border-radius:15px;background:rgba(255,255,255,.16);position:relative;flex:none;cursor:pointer;transition:background .25s;margin:0}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:12px;background:#fff;transition:transform .25s var(--ease);box-shadow:0 2px 6px rgba(0,0,0,.3)}
.switch:checked{background:var(--purple)}
.switch:checked::after{transform:translateX(20px)}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chip{display:flex;align-items:center;gap:8px;height:44px;padding:0 14px 0 8px;border-radius:22px;background:var(--glass);border:1px solid var(--line);font-size:14px;font-weight:600;white-space:nowrap;flex:none}
.chip.txt{padding:0 16px}
.chip[aria-pressed="true"]{background:rgba(118,92,214,.28);border-color:var(--lilac)}
.divider{height:1px;background:rgba(255,255,255,.08)}
.kv{display:flex;justify-content:space-between;align-items:center;gap:16px;min-height:50px;border-bottom:1px solid rgba(255,255,255,.07);font-size:14px}
.kv:last-child{border-bottom:0}
.kv span:first-child{color:var(--muted)}
.kv span:last-child{font-weight:600;text-align:right}
.handle{font-weight:700;letter-spacing:-.2px}
.seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;padding:5px;border-radius:18px;background:var(--glass);border:1px solid var(--line)}
.seg button{height:42px;border-radius:14px;border:0;background:transparent;font-weight:600;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:rgba(118,92,214,.4);color:#fff}

/* tab bar */
.tabbar{position:absolute;left:16px;right:16px;bottom:calc(18px + env(safe-area-inset-bottom,0px));height:74px;z-index:20;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));align-items:center;padding:0 6px;border-radius:37px;background:rgba(30,28,38,.86);border:1px solid var(--line-2);box-shadow:inset 0 1px 0 rgba(255,255,255,.10),0 18px 44px rgba(0,0,0,.55);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px)}
.tabfade{position:absolute;left:0;right:0;bottom:0;height:calc(130px + env(safe-area-inset-bottom,0px));z-index:19;pointer-events:none;background:linear-gradient(to top,var(--bg) 38%,rgba(18,17,23,0))}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;height:74px;padding:0;background:none;border:0;font-size:11.5px;font-weight:600;line-height:1;color:var(--faint);transition:color .2s}
.tab .ind{width:56px;height:30px;border-radius:15px;display:flex;align-items:center;justify-content:center;transition:background .25s var(--ease),transform .25s var(--ease)}
.tab:active .ind{transform:scale(.92)}
.tab[aria-current="page"]{color:var(--lilac-2)}
.tab[aria-current="page"] .ind{background:rgba(118,92,214,.32)}

/* home */
.handlebtn{display:flex;align-items:center;gap:10px;height:44px;padding:0 14px 0 6px;border-radius:22px;background:var(--glass);border:1px solid var(--line);font-size:16px}
.handlebtn .mk{width:32px;height:32px;border-radius:16px}
.balance{padding:22px 22px 20px;border-radius:30px;position:relative;overflow:hidden}
.balance::after{content:"";position:absolute;width:220px;height:220px;right:-80px;top:-90px;border-radius:50%;background:radial-gradient(circle,rgba(185,166,250,.28),transparent 70%)}
.big{font-size:40px;font-weight:700;letter-spacing:-1px;line-height:1.1}
.big .cents{color:rgba(255,255,255,.5)}
.actions{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.act{display:flex;flex-direction:column;align-items:center;gap:8px;background:none;border:0;font-size:12.5px;font-weight:600;padding:0}
.act span.c{width:58px;height:58px;border-radius:29px;display:flex;align-items:center;justify-content:center;background:var(--glass);border:1px solid var(--line);transition:transform .15s var(--ease)}
.act:active span.c{transform:scale(.92)}
.act.primary span.c{background:linear-gradient(135deg,#7A60DA,#4C3A8F);border:0;box-shadow:0 10px 24px rgba(118,92,214,.35)}
.banner{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:20px;background:rgba(107,239,183,.09);border:1px solid rgba(107,239,183,.32);width:100%;text-align:left}
.promo{position:relative;overflow:hidden;padding:20px;border-radius:26px;background:linear-gradient(135deg,rgba(118,92,214,.36),rgba(76,58,143,.18) 60%,rgba(241,187,242,.12));border:1px solid rgba(185,166,250,.35)}
.promo .glyph{position:absolute;right:-6px;top:-18px;font-size:110px;font-weight:800;color:rgba(255,255,255,.07);letter-spacing:-4px}
.badgecount{position:absolute;top:-3px;right:-3px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--mint);color:#06231A;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;border:2px solid var(--bg)}

/* sheets */
.scrim{position:absolute;inset:0;z-index:40;background:rgba(6,5,10,.55);backdrop-filter:blur(4px);animation:fadeIn .25s ease both}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:41;max-height:88%;overflow-y:auto;padding:12px 20px calc(24px + env(safe-area-inset-bottom,0px));border-radius:32px 32px 0 0;background:#1C1A23;border-top:1px solid var(--line-2);box-shadow:0 -20px 60px rgba(0,0,0,.5);animation:sheetUp .42s var(--ease) both}
.sheet.closing{animation:sheetDown .26s ease both}
.scrim.closing{animation:fadeOut .26s ease both}
.grab{width:40px;height:5px;border-radius:3px;background:rgba(255,255,255,.22);margin:0 auto 16px}
@keyframes sheetUp{from{transform:translateY(100%)}to{transform:none}}
@keyframes sheetDown{to{transform:translateY(100%)}}

/* face id */
.fid{position:absolute;inset:0;z-index:60;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:rgba(10,9,14,.6);backdrop-filter:blur(10px);animation:fadeIn .2s ease both}
.fid-box{width:120px;height:120px;border-radius:30px;background:rgba(28,26,35,.92);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
.fid-box .scan{position:absolute;left:14px;right:14px;height:2px;background:linear-gradient(90deg,transparent,var(--lilac),transparent);top:20%;animation:scan .9s ease-in-out infinite alternate}
@keyframes scan{to{top:78%}}
.fid-box .ok{position:absolute;opacity:0;transform:scale(.6);transition:all .3s var(--ease)}
.fid.done .ok{opacity:1;transform:none}
.fid.done .face,.fid.done .scan{opacity:0;transition:opacity .2s}
.fid p{font-weight:600}

/* success */
.burst{position:relative;width:190px;height:190px;display:flex;align-items:center;justify-content:center;margin:0 auto}
.burst .ring{position:absolute;inset:0;border-radius:50%;border:2px solid rgba(107,239,183,.35);animation:ripple 1.6s ease-out .2s both}
.burst .ring.r2{inset:24px;border-color:rgba(107,239,183,.55);animation-delay:.05s}
@keyframes ripple{from{transform:scale(.6);opacity:0}40%{opacity:1}to{transform:scale(1);opacity:1}}
.burst .core{width:112px;height:112px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--glass);border:1px solid var(--line-2);box-shadow:0 0 50px rgba(107,239,183,.28);animation:pop .5s var(--ease) both}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:none;opacity:1}}
.draw path{stroke-dasharray:30;stroke-dashoffset:30;animation:draw .5s ease .35s forwards}
@keyframes draw{to{stroke-dashoffset:0}}
canvas.confetti{position:absolute;inset:0;z-index:30;pointer-events:none}

/* splash */
.splash{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer}
.rings{position:absolute;left:50%;top:44%;width:0;height:0}
.rings i{position:absolute;border-radius:50%;border:1px solid rgba(185,166,250,.14);left:50%;top:50%;transform:translate(-50%,-50%);animation:breathe 4s ease-in-out infinite}
.rings i:nth-child(1){width:300px;height:300px}
.rings i:nth-child(2){width:440px;height:440px;animation-delay:.6s;border-color:rgba(185,166,250,.09)}
.rings i:nth-child(3){width:600px;height:600px;animation-delay:1.2s;border-color:rgba(185,166,250,.05)}
@keyframes breathe{50%{transform:translate(-50%,-50%) scale(1.04)}}
.sp-stage{position:relative;margin-top:-80px;display:flex;flex-direction:column;align-items:center;gap:26px}
.sp-pill{position:relative;width:340px;max-width:calc(100vw - 32px);height:56px;border-radius:28px;display:flex;align-items:center;justify-content:center;background:var(--glass);border:1px solid var(--line);box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 20px 50px rgba(0,0,0,.4);transition:width .7s var(--ease),height .6s var(--ease),border-radius .6s var(--ease),box-shadow .6s;opacity:0;transform:scale(.92);animation:pop .6s var(--ease) .15s forwards}
.sp-pill.h{width:270px;height:66px;border-radius:33px;box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 0 50px rgba(160,138,238,.35)}
.sp-pill.logo{width:230px;height:100px;border-radius:50px;box-shadow:inset 0 1px 0 rgba(255,255,255,.16),0 0 70px rgba(160,138,238,.45),0 24px 50px rgba(0,0,0,.45)}
#spText{font-size:11.5px;font-weight:600;letter-spacing:.4px;color:var(--muted);white-space:nowrap;transition:opacity .3s,font-size .4s}
.sp-pill.h #spText{font-size:24px;font-weight:700;letter-spacing:-.3px;color:#fff}
.sp-pill.logo #spText{opacity:0}
#spLogo{position:absolute;height:54px;opacity:0;transform:scale(.8);transition:opacity .5s ease .1s,transform .6s var(--ease) .1s}
.sp-pill.logo #spLogo{opacity:1;transform:none}
.sp-tag{font-size:22px;font-weight:700;opacity:0;transform:translateY(10px);transition:all .6s var(--ease)}
.sp-foot{position:absolute;left:24px;right:24px;bottom:calc(36px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;align-items:center;gap:12px;opacity:0;transform:translateY(16px);transition:all .6s var(--ease)}
.splash.done .sp-tag,.splash.done .sp-foot{opacity:1;transform:none}

.k2{position:absolute;inset:0}
.k2-pill{position:absolute;left:50%;top:42%;border-radius:32px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);box-shadow:inset 0 1px 0 rgba(255,255,255,.16),0 0 46px rgba(160,138,238,.42)}
.k2-row{position:absolute;left:0;right:0;top:42%;height:44px;margin-top:-22px;display:flex;align-items:center;justify-content:center;white-space:nowrap;font-size:24px;font-weight:700;letter-spacing:-.4px;pointer-events:none}
.k2-logo{position:absolute;left:50%;top:42%;height:58px;transform:translate(-50%,-50%)}
.k2-tag{position:absolute;left:0;right:0;top:calc(42% + 84px);margin:0;text-align:center;font-size:22px;font-weight:700}
.stickybar{position:sticky;bottom:-28px;margin:20px -20px -28px;padding:16px 20px calc(28px + env(safe-area-inset-bottom,0px));background:linear-gradient(to top,var(--bg) 72%,rgba(18,17,23,0));z-index:5}
/* misc */
.addr2handle{padding:26px 18px;border-radius:30px;display:flex;flex-direction:column;align-items:center;gap:14px}
.addrchip{height:48px;padding:0 22px;border-radius:24px;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.04);border:1px solid var(--line);font-size:clamp(13px,4.2vw,16px);font-weight:600;letter-spacing:.2px;color:var(--muted);max-width:100%;box-sizing:border-box;white-space:nowrap}
.handlechip{height:60px;padding:0 26px;border-radius:30px;display:flex;align-items:center;background:var(--glass-2);border:1px solid var(--line-2);font-size:24px;animation:glow 2.6s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 0 44px rgba(160,138,238,.45)}}
.bob{animation:bob 1.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(5px)}}
.toast{position:absolute;left:50%;bottom:calc(108px + env(safe-area-inset-bottom,0px));z-index:80;transform:translateX(-50%);padding:12px 18px;border-radius:22px;background:rgba(40,38,48,.96);border:1px solid var(--line-2);font-size:14px;font-weight:600;white-space:nowrap;box-shadow:0 14px 34px rgba(0,0,0,.45);animation:toast 2.2s var(--ease) both;display:flex;align-items:center;gap:8px}
@keyframes toast{0%{opacity:0;transform:translate(-50%,12px)}12%,85%{opacity:1;transform:translate(-50%,0)}100%{opacity:0;transform:translate(-50%,6px)}}
.spinner{width:16px;height:16px;border-radius:50%;border:2px solid rgba(255,255,255,.2);border-top-color:var(--lilac);animation:spin .7s linear infinite;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}
.shimmer{background:linear-gradient(90deg,rgba(255,255,255,.04),rgba(255,255,255,.12),rgba(255,255,255,.04));background-size:200% 100%;animation:sh 1s linear infinite}
@keyframes sh{to{background-position:-200% 0}}
.steps .st{display:flex;align-items:center;gap:12px;min-height:44px;font-weight:600;font-size:15px;color:var(--faint);transition:color .3s}
.steps .st.on{color:#fff}

/* ---------- router ---------- */
let cur = null, hist = [], tabScreens = ['home','activity','domains','settings'];
function go(name, opts={}){
  const dir = opts.dir || (tabScreens.includes(name) && tabScreens.includes(cur?.name) ? 'fade' : 'fwd');
  if (!opts.noHist && cur && !opts.replace) hist.push(cur);
  closeSheet(true);
  const old = stage.querySelector('.screen:not(.leave)');
  const el = document.createElement('div');
  const def = SCREENS[name];
  el.className = 'screen' + (def.tabs ? ' has-tabs' : '') + ' enter-' + dir;
  el.dataset.name = name;
  el.innerHTML = def.html(opts.arg);
  stage.appendChild(el);
  if (old){ old.classList.add('leave'); setTimeout(()=>old.remove(), 240); }
  stage.querySelectorAll('.tabbar,.tabfade').forEach(t=>t.remove());
  if (def.tabs){ const tf = document.createElement('div'); tf.className='tabfade'; tf.setAttribute('aria-hidden','true'); stage.appendChild(tf); const tb = document.createElement('nav'); tb.className='tabbar'; tb.setAttribute('aria-label','Main'); tb.innerHTML = tabbar(def.tabs); stage.appendChild(tb); }
  cur = {name, arg:opts.arg};
  if (def.after) def.after(el, opts.arg);
  el.scrollTop = 0;
}
function back(){ const p = hist.pop(); if (!p) return go('home',{noHist:true,dir:'back'}); go(p.name,{arg:p.arg,noHist:true,dir:'back'}); }
function refresh(){ if (!cur) return; const el = stage.querySelector('.screen:not(.leave)'); const st = el.scrollTop; const def = SCREENS[cur.name]; el.innerHTML = def.html(cur.arg); el.classList.remove('enter-fwd','enter-back','enter-fade'); el.querySelectorAll('.stagger').forEach(s=>s.classList.remove('stagger')); if (def.after) def.after(el, cur.arg, true); el.scrollTop = st; }

/* ---------- overlays ---------- */
let sheetEl = null, scrimEl = null;
function openSheet(html, after){
  closeSheet(true);
  scrimEl = document.createElement('div'); scrimEl.className='scrim'; scrimEl.dataset.act='closeSheet';
  sheetEl = document.createElement('div'); sheetEl.className='sheet'; sheetEl.setAttribute('role','dialog'); sheetEl.setAttribute('aria-modal','true');
  sheetEl.innerHTML = '<div class="grab"></div>' + html;
  stage.append(scrimEl, sheetEl);
  if (after) after(sheetEl);
}
function closeSheet(now){
  if (!sheetEl) return;
  const s = sheetEl, c = scrimEl; sheetEl = scrimEl = null;
  if (now){ s.remove(); c.remove(); return; }
  s.classList.add('closing'); c.classList.add('closing'); setTimeout(()=>{s.remove(); c.remove();}, 260);
}
function toast(msg, icon='checkc'){
  stage.querySelectorAll('.toast').forEach(t=>t.remove());
  const t = document.createElement('div'); t.className='toast'; t.setAttribute('role','status');
  t.innerHTML = `${ic(icon,18,2.2,'#8FF5C9')}<span>${msg}</span>`; stage.appendChild(t); setTimeout(()=>t.remove(), 2300);
}
function faceId(label, cb){

}
function confetti(host=stage){
  if (reduce) return;
  const c = document.createElement('canvas'); c.className='confetti'; host.appendChild(c);
  const w = c.width = host.clientWidth*2, h = c.height = host.clientHeight*2, x = c.getContext('2d');
  const cols = ['#B9A6FA','#765CD6','#6BEFB7','#F1BBF2','#FDFF9B','#FFFFFF'];
  const P = Array.from({length:120},()=>({x:w/2,y:h*0.32,vx:(Math.random()-.5)*28,vy:-Math.random()*26-6,r:Math.random()*10+6,c:cols[Math.random()*cols.length|0],a:Math.random()*6,va:(Math.random()-.5)*.3,sh:Math.random()<.5}));
  let f=0; (function tick(){ x.clearRect(0,0,w,h); P.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=0.9;p.vx*=.985;p.a+=p.va; x.save();x.translate(p.x,p.y);x.rotate(p.a);x.fillStyle=p.c;x.globalAlpha=Math.max(0,1-f/110);
    if(p.sh){x.fillRect(-p.r/2,-p.r/4,p.r,p.r/2)}else{x.beginPath();x.arc(0,0,p.r/3,0,7);x.fill()} x.restore();}); if(++f<120) requestAnimationFrame(tick); else c.remove(); })();
}
function countUp(el, to){
  if (!el) return;
  const fmt = v => { const s = usd(v); const i = s.lastIndexOf('.'); return `${s.slice(0,i)}<span class="cents">${s.slice(i)}</span>`; };
  if (reduce || S.counted){ el.innerHTML = fmt(to); return; }
  S.counted = true; const t0 = performance.now(), d = 1100;
  (function step(t){ const k = Math.min(1,(t-t0)/d), e = 1-Math.pow(1-k,3); el.innerHTML = fmt(to*e); if (k<1) requestAnimationFrame(step); })(t0);
}
function drawQR(canvas, text){
  const n=29, ctx=canvas.getContext('2d'), size=canvas.width, m=size/n; ctx.fillStyle='#fff'; ctx.fillRect(0,0,size,size); ctx.fillStyle='#17161B';
  let seed=0; for (const ch of text) seed=(seed*131+ch.charCodeAt(0))>>>0; const rnd=()=>{seed^=seed<<13;seed^=seed>>>17;seed^=seed<<5;return (seed>>>0)/4294967296};
  const finder=(x,y)=>{ctx.fillRect(x*m,y*m,7*m,7*m);ctx.fillStyle='#fff';ctx.fillRect((x+1)*m,(y+1)*m,5*m,5*m);ctx.fillStyle='#17161B';ctx.fillRect((x+2)*m,(y+2)*m,3*m,3*m)};
  for(let y=0;y<n;y++)for(let x=0;x<n;x++){const inF=(x<8&&y<8)||(x>n-9&&y<8)||(x<8&&y>n-9)||(x>10&&x<18&&y>10&&y<18); if(!inF&&rnd()<.5){ctx.beginPath();ctx.roundRect(x*m+.6,y*m+.6,m-1.2,m-1.2,m*.3);ctx.fill()}}
  finder(0,0);finder(n-7,0);finder(0,n-7);
  ctx.fillStyle='#fff';ctx.beginPath();ctx.roundRect(11*m,11*m,7*m,7*m,m*1.6);ctx.fill();
  const im=new Image(); im.onload=()=>{const hgt=5*m, wd=hgt*im.width/im.height; ctx.drawImage(im,14.5*m-wd/2,12*m,wd,hgt)}; im.src=IMG.fmark;
}

const SCREENS = {};

SCREENS.splash = {
  html:()=>`<div class="splash" id="splash">
    <div class="rings" aria-hidden="true"><i></i><i></i><i></i></div>
    <div class="k2" id="k2" aria-label="FIO. Own your web3 identity" role="img"></div>
    <div class="sp-foot"><button class="btn primary" data-go="welcome">Get started</button><button class="btn ghost" data-act="connectMM"><img src="${IMG.metamask}" alt="" style="width:30px;height:30px;margin-left:-6px">Connect with MetaMask</button><p class="eyebrow">Simple · Secure · Sovereign</p></div>
  </div>`,
  after(el){
    const sp = $('#splash',el), st = $('#k2',el);
    const ADDR = '0x78508ed850fC5D3A10', H1 = 'yourname', H2 = '@web3';
    const k = 0.72; // overall speed: lower is faster
    const ms = v => Math.round(v*k);
    const an = (e, kf, o) => e.animate(kf, Object.assign({fill:'both', easing:'cubic-bezier(.2,.8,.2,1)'}, o));
    const mk = (host, html) => { const t=document.createElement('div'); t.innerHTML=html.trim(); const n=t.firstChild; host.appendChild(n); return n; };
    const EIN='cubic-bezier(.11,0,.5,0)', EOUT='cubic-bezier(.5,1,.89,1)', IO='cubic-bezier(.65,0,.35,1)';
    const box = (w,h) => ({width:w+'px',height:h+'px',marginLeft:-w/2+'px',marginTop:-h/2+'px',borderRadius:h/2+'px'});
    const row = () => mk(st, `<div class="k2-row"></div>`);
    const span = (els) => els[els.length-1].offsetLeft + els[els.length-1].offsetWidth - els[0].offsetLeft;
    const chars = (r, txt, lil, maxW) => { const out=[...txt].map((ch,i)=>mk(r, `<span style="display:inline-block;${lil>=0&&i>=lil?'color:var(--lilac)':''}">${ch}</span>`));
      const w = span(out); if (w>maxW) r.style.fontSize=(24*maxW/w).toFixed(2)+'px'; return out; };
    const dxs = (r, els) => { const c=r.clientWidth/2; return els.map(e=>c-(e.offsetLeft+e.offsetWidth/2)); };
    const path = (dx, inward) => { const out=[], q=Math.min(.9,10/Math.max(1,Math.abs(dx))); for (let j=0;j<=8;j++){ const p=j/8;
      out.push(inward ? {offset:p, transform:`translateX(${dx*p}px)`, opacity:p<=1-q?1:Math.max(0,(1-p)/q)} : {offset:p, transform:`translateX(${dx*(1-p)}px)`, opacity:p>=q?1:p/q}); } return out; };
    let started = false, finished = false, tm;
    const finish = () => { finished = true; clearTimeout(tm); st.getAnimations({subtree:true}).forEach(x=>x.finish()); sp.classList.add('done'); };
    sp.addEventListener('click', e=>{ if (!e.target.closest('button')){ if (!started) start(); finish(); } });
    const start = () => { if (started) return; started = true;
      // 1. address bar, sized to the address once the real font is in
      const r = row(); r.style.color='rgba(255,255,255,.78)';
      const cs = chars(r, ADDR, -1, Math.min(268, st.clientWidth-80));
      const W0 = Math.round(span(cs) + 44);
      const bar = mk(st, `<div class="k2-pill" style="width:${W0}px;height:64px;margin:-32px 0 0 ${-W0/2}px"></div>`); st.insertBefore(bar, r);
      an(bar,[{opacity:0},{opacity:1}],{duration:ms(450),delay:ms(120)}); an(r,[{opacity:0},{opacity:1}],{duration:ms(450),delay:ms(120)});
      // 2. both halves slide into the center while the bar closes into a drop
      const T=ms(650), D=ms(700), dx=dxs(r,cs), mx=Math.max(...dx.map(Math.abs));
      cs.forEach((c,i)=>an(c, path(dx[i],true), {duration:D*Math.sqrt(Math.abs(dx[i])/mx)+ms(40), delay:T, easing:EIN}));
      const hit = T+D+ms(40);
      an(bar,[box(W0,64),box(64,64)],{duration:D+ms(40),delay:T,easing:EIN});
      an(bar,[{background:'rgba(255,255,255,.08)'},{background:'radial-gradient(circle,rgba(214,203,255,.55),rgba(118,92,214,.25) 70%)',offset:.5},{background:'rgba(255,255,255,.08)'}],{duration:ms(800),delay:hit-ms(320),easing:'ease-in-out',fill:'forwards'});
      // 3. the drop stretches into the handle, letters slide out of the center
      const r2 = row(); const hs = chars(r2, H1+H2, H1.length, Math.min(236, st.clientWidth-100)), W1 = Math.round(span(hs) + 46);
      const hx = dxs(r2,hs), hm = Math.max(...hx.map(Math.abs));
      an(bar,[box(64,64),box(W1,64)],{duration:ms(650),delay:hit,easing:EOUT,fill:'forwards'});
      hs.forEach((c,i)=>{ const d=ms(620)*Math.sqrt(Math.abs(hx[i])/hm)+ms(40); an(c, path(hx[i],false), {duration:d, delay:hit+(ms(660)-d), easing:EOUT}); });
      // 4. handle pill morphs into the logo pill
      const M = hit+ms(950);
      an(bar,[box(W1,64),box(236,104)],{duration:ms(760),delay:M,easing:IO,fill:'forwards'});
      an(bar,[{boxShadow:'inset 0 1px 0 rgba(255,255,255,.16),0 0 46px rgba(160,138,238,.42)'},{boxShadow:'inset 0 1px 0 rgba(255,255,255,.2),0 0 80px rgba(160,138,238,.6)',offset:.5},{boxShadow:'inset 0 1px 0 rgba(255,255,255,.16),0 0 60px rgba(160,138,238,.35),0 24px 50px rgba(0,0,0,.45)'}],{duration:ms(900),delay:M,easing:'ease-in-out',fill:'forwards'});
      an(r2,[{opacity:1,transform:'none',filter:'blur(0)'},{opacity:0,transform:'scale(.9)',filter:'blur(5px)'}],{duration:ms(380),delay:M,easing:'ease-in',fill:'forwards'});
      const lg = mk(st, `<img class="k2-logo" src="${IMG.lockup}" alt="">`);
      an(lg,[{opacity:0,transform:'translate(-50%,-50%) scale(.86)',filter:'blur(6px)'},{opacity:1,transform:'translate(-50%,-50%)',filter:'blur(0)'}],{duration:ms(620),delay:M+ms(260)});
      const tl = mk(st, `<p class="k2-tag">Own your web3 identity</p>`);
      an(tl,[{opacity:0,transform:'translateY(12px)'},{opacity:1,transform:'none'}],{duration:ms(700),delay:M+ms(520)});
      tm = setTimeout(()=>sp.classList.add('done'), M+ms(900));
      if (reduce || finished) finish();
    };
    // wait for Montserrat so the address is measured in the font it will be drawn in
    const fontsIn = document.fonts && document.fonts.load ? Promise.all([document.fonts.load('700 24px Montserrat'), document.fonts.ready]) : Promise.resolve();
    Promise.race([fontsIn, new Promise(r=>setTimeout(r,1200))]).then(start, start);
  }
};

function resolveState(v){
  if (!v) return {s:'empty'};
  if (/^[a-z0-9-]+@[a-z0-9-]+$/.test(v)) return v===myHandle() ? {s:'self'} : {s:'ok'};
  if (/^(0x[0-9a-f]{8,}|bc1[0-9a-z]{8,}|t[1-9a-z]{20,})$/i.test(v)) return {s:'raw'};
  return {s:'typing'};
}
function wireRecipient(el, mode){
  const D = mode==='send'?S.send:S.req; const inp=$('#toIn',el), st=$('#toStatus',el), av=$('#toAv',el), btn=$(mode==='send'?'#sendGo':'#reqGo',el);
  const amtIn=$('#amtIn',el), memo=$('#memoIn',el); let t, resolved=false;
  const validate = () => { const a=asset(D.asset), n=parseFloat(D.amount); const okAmt = n>0 && (mode!=='send' || n<=a.bal);
    $('#amtUsd',el).textContent = `≈ ${usd((n||0)*a.px)}` + (mode==='send' && n>a.bal ? ' · more than your balance' : '');
    btn.disabled = !(resolved && okAmt); };
  const look = (instant) => {
    const v = inp.value.trim().toLowerCase(); D.to=v; resolved=false; clearTimeout(t); validate();
    const r = resolveState(v), chain = chainOfAsset(D.asset), cname = CHAINS.find(c=>c.id===chain).name;
    if (r.s==='empty'||r.s==='typing'){ st.innerHTML = r.s==='typing'?`<span class="small">Type a full handle like name@domain</span>`:''; av.innerHTML=ic('at',22,2,'rgba(255,255,255,.5)'); return; }
    if (r.s==='self'){ st.innerHTML=`<span class="pill warn">That's your own handle</span>`; return; }
    if (r.s==='raw'){ st.innerHTML=`<span class="pill warn">${ic('shield',15,2.2)}Raw address. Double-check every character</span>`; resolved=true; validate(); return; }
    st.innerHTML = `<span class="pill dim shimmer"><span class="spinner"></span>Looking up ${esc(v)} on FIO Chain…</span>`;
    t = setTimeout(()=>{ resolved=true; av.innerHTML = avatarFor(v,32);
      st.innerHTML = `<span class="pill ok" style="animation:pop .35s var(--ease)">${ic('checkc',16,2.4)}Resolved · ${fakeAddr(v,chain)} on ${cname}</span>`; validate(); }, instant?0:700);
  };
  inp.addEventListener('input', ()=>look());
  amtIn.addEventListener('input', ()=>{ amtIn.value = amtIn.value.replace(/[^0-9.]/g,'').replace(/(\..*)\./g,'$1'); D.amount=amtIn.value; validate(); });
  memo.addEventListener('input', ()=>D.memo=memo.value);
  const fit = () => { amtIn.style.width = (Math.max(1, amtIn.value.length) + 0.4) + 'ch'; };
  amtIn.addEventListener('input', fit); fit(); el._fit = fit;
  el._look = look; el._validate = validate;
  if (D.to) look(true); else validate();
}

  domainFromReady(){ hist=[]; S.dom.q = S.handle||''; go('domains',{noHist:true,dir:'fade'}); setTimeout(()=>go('domainSearch'), 380); },
  copyHandle(){ const h=myHandle(); try{ navigator.clipboard.writeText(h).catch(()=>{}); }catch(e){} toast(`Copied ${h}`); },
  shareHandle(){ const h=myHandle(); try{ navigator.clipboard.writeText(`Pay me at ${h}`).catch(()=>{}); }catch(e){} toast('Link copied to share'); },
  copyAddr(b){ toast(`${b.dataset.c} address copied`); },
  noNotes(){ toast('You are all caught up','bell'); },
  openIncoming(b){ go('incoming',{arg:b?.dataset?.r || S.incoming[0]?.id}); },
  openAsset(b){ assetSheet(b.dataset.a); },
  sendAsset(b){ S.send.asset=b.dataset.a; closeSheet(true); go('send'); },
  recvAsset(){ closeSheet(true); go('receive'); },
  openSend(){ go('send'); },
  pickTo(b){ const el=stage.querySelector('.screen:not(.leave)'); const inp=$('#toIn',el); inp.value=b.dataset.h; el._look(); },
  pickAsset(b){ const el=stage.querySelector('.screen:not(.leave)'); const D = cur.name==='send'?S.send:S.req; D.asset=b.dataset.a;
    el.querySelectorAll('[data-act="pickAsset"]').forEach(x=>x.setAttribute('aria-pressed', x.dataset.a===D.asset)); const a=asset(D.asset);
    $('#amtSym',el).textContent=a.sym; const ab=$('#amtBal',el); if (ab) ab.textContent=amt(a.bal,a.dec); if (D.to) el._look(true); else el._validate(); },
  max(){ const el=stage.querySelector('.screen:not(.leave)'); const a=asset(S.send.asset); S.send.amount=String(+(a.bal).toFixed(a.dec)); $('#amtIn',el).value=S.send.amount; el._fit(); el._validate(); },
  reviewSend(){ const a=asset(S.send.asset), n=parseFloat(S.send.amount), to=S.send.to, raw=resolveState(to).s==='raw', ch=chainOfAsset(a.id);
    startTx({title:'Send', out:true, img:a.img, sym:a.sym, dec:a.dec, amount:n, px:a.px, from:myHandle(), fromAddr:chainAddr(a.net), to: raw?to.slice(0,6)+'…'+to.slice(-4):to, raw,
      toAddr: raw?'Raw address':fakeAddr(to,ch)+' · '+a.net, net:a.net, feeAsset:a.id==='usdt'?'eth':a.id, feeBase:FEES[a.id], memo:S.send.memo,
      exec(t){ a.bal=+(a.bal-n).toFixed(8); const fa=asset(t.feeAsset); fa.bal=+(fa.bal-txFee(t)).toFixed(8);
        addAct({kind:'out', who:raw?to.slice(0,8)+'…':to, sym:a.sym, amount:n, memo:S.send.memo, net:a.net});
        const r={title:'Sent!', sub:`${amt(n,a.dec)} ${a.sym} is on its way to <span class="handle" style="color:var(--lilac-2)">${raw?esc(to.slice(0,10))+'…':esc(to)}</span>`, rows:[['Status',`<span style="color:var(--mint-t)">● Confirmed</span>`],['Network',a.net],['Network fee',`${+txFee(t).toPrecision(2)} ${t.feeAsset==='usdt'?'ETH':fa.sym}`],...(S.send.memo?[['Memo',esc(S.send.memo)+' · encrypted']]:[]),['Tx hash',`${t.hash.slice(0,8)}…${t.hash.slice(-6)}`]], second:['Send another','again']};
        S.send={to:'',asset:a.id,amount:'',memo:''}; S.counted=true; hist=[]; go('sent',{arg:r,noHist:true}); } }); },
  txSpeed(b){ S.tx.speed=+b.dataset.i; refresh(); },
  txCancel(){ toast('Transaction cancelled','x'); back(); },
  txApprove(){ faceId('Approve transaction', ()=>{ go('broadcast',{replace:true}); }); },
  again(){ hist=[{name:'home'}]; go('send',{noHist:true}); },
  sendRequest(){ const a=asset(S.req.asset), n=parseFloat(S.req.amount), who=S.req.to||S.req.from; addAct({kind:'req', who, sym:a.sym, amount:n, memo:S.req.memo, net:a.net});
    const r={title:'Request sent', sub:`<span class="handle" style="color:var(--lilac-2)">${esc(who)}</span> will see it in any FIO-enabled wallet.`, rows:[['Amount',`${amt(n)} ${a.sym}`],['Network',a.net],...(S.req.memo?[['Memo',esc(S.req.memo)+' · encrypted']]:[]),['Status','Waiting for payment']]};
    S.req={from:'',asset:a.id,amount:'',memo:''}; hist=[]; go('sent',{arg:r,noHist:true}); },
  declineReq(b){ S.incoming=S.incoming.filter(x=>x.id!==b.dataset.r); toast('Request declined','x'); hist=[]; go('home',{noHist:true,dir:'back'}); },
  payReq(b){ const r=S.incoming.find(x=>x.id===b.dataset.r), a=asset(r.sym.toLowerCase());
    startTx({title:'Pay request', out:true, img:a.img, sym:a.sym, dec:a.dec, amount:r.amount, px:a.px, from:myHandle(), fromAddr:chainAddr(r.net), to:r.who, toAddr:r.addr+' · '+r.net, net:r.net,
      feeAsset:a.id==='usdt'?'eth':a.id, feeBase:FEES[a.id], memo:r.memo,
      exec(t){ a.bal=+(a.bal-r.amount).toFixed(8); const fa=asset(t.feeAsset); fa.bal=+(fa.bal-txFee(t)).toFixed(8);
        S.incoming=S.incoming.filter(x=>x.id!==r.id); addAct({kind:'paidreq', who:r.who, sym:r.sym, amount:r.amount, memo:r.memo, net:r.net});
        hist=[]; go('sent',{noHist:true,arg:{title:'Paid',sub:`${amt(r.amount)} ${r.sym} sent to <span class="handle" style="color:var(--lilac-2)">${esc(r.who)}</span>. No copy-paste errors.`,rows:[['Status',`<span style="color:var(--mint-t)">● Confirmed</span>`],['Memo',esc(r.memo)+' · encrypted'],['Network',r.net],['Tx hash',`${t.hash.slice(0,8)}…${t.hash.slice(-6)}`]]}}); } }); },
  filter(b){ S.filter=b.dataset.f; refresh(); },
  openAct(b){ const x=S.activity.find(y=>y.id==b.dataset.id); openSheet(`<h2 style="text-align:center">${actLabel(x)}</h2><div style="text-align:center" class="mt-16">${x.amount!=null?`<div class="big num">${amt(x.amount)} <span class="at">${x.sym}</span></div>`:''}${x.who?`<p class="handle mt-8" style="font-size:18px">${hh(x.who)}</p>`:''}</div>
    <div class="glass list mt-20" style="padding:2px 18px"><div class="kv"><span>Status</span><span style="color:${x.kind==='req'?'var(--yellow)':'var(--mint-t)'}">${x.kind==='req'?'Pending':'Confirmed'}</span></div>${x.net?`<div class="kv"><span>Network</span><span>${x.net}</span></div>`:''}<div class="kv"><span>When</span><span>${x.when}</span></div>${x.memo?`<div class="kv"><span>Memo</span><span>${esc(x.memo)} ${ic('lock',13,2.2,'#B9A6FA')}</span></div>`:''}</div>
    <button class="btn ghost mt-20" data-act="closeSheet">Close</button>`); },
  searchDomain(b){ S.dom.q=b.dataset.q; if (cur.name==='domainSearch'){ const el=stage.querySelector('.screen:not(.leave)'); $('#dIn',el).value=S.dom.q; el._run(); } else go('domainSearch'); },
  term(b){ S.dom.term=+b.dataset.y; const el=stage.querySelector('.screen:not(.leave)'); el.querySelectorAll('[data-act="term"]').forEach(x=>x.setAttribute('aria-pressed', +x.dataset.y===S.dom.term));
    $('#dPrice',el).innerHTML = `${amt(domFee(S.dom.term))} FIO <span class="small">≈ ${usd(domFee(S.dom.term)*FIO_PX)}</span>`; },
  domainCheckout(){ const fio=domFee(S.dom.term); if (asset('fio').bal<fio) S.dom.pay = asset('usdt').bal>=fio*FIO_PX?'usdt':'card'; go('checkout'); },
  payWith(b){ S.dom.pay=b.dataset.p; refresh(); },
  buyDomain(){ const q=S.dom.q, term=S.dom.term, fio=domFee(term), usdV=fio*FIO_PX, pay=S.dom.pay;
    startTx({title:'Register domain', img: pay==='usdt'?'usdt':'fio', sym: pay==='fio'?'FIO':pay==='usdt'?'USDT':'USD', dec:2, amount: pay==='fio'?fio:usdV, px: pay==='fio'?FIO_PX:1, usd:usdV,
      from:myHandle(), fromAddr: pay==='card'?'Card payment':chainAddr('FIO Chain'), to:'FIO Chain', contract:true, toAddr:'fio.address · regdomain', net:'FIO Chain', feeBase:0,
      action:`Register <span class="handle">@${esc(q)}</span> · ${term} year${term>1?'s':''}`,
      exec(){ if (pay==='fio') asset('fio').bal-=fio; else if (pay==='usdt') asset('usdt').bal=+(asset('usdt').bal-usdV).toFixed(2);
        const y=new Date(); y.setFullYear(y.getFullYear()+term);
        S.domains.unshift({name:q, public:false, expires:y.toLocaleDateString('en-US',{month:'short',year:'numeric'}), handles:[], wrapped:false});
        addAct({kind:'domain', who:'@'+q, sym:pay==='fio'?'FIO':'USD', amount:null, memo:`${term} year${term>1?'s':''}`, net:'FIO Chain'}); hist=[]; go('minting',{noHist:true}); } }); },
  openDomain(b){ go('domain',{arg:b.dataset.d}); },
  togglePublic(b){ const d=S.domains.find(x=>x.name===b.dataset.d); d.public=b.checked; const el=stage.querySelector('.screen:not(.leave)');
    $('#pubTxt',el).textContent = d.public?`Anyone can register a handle on @${d.name}.`:`Private. Only you can create handles on @${d.name}.`; toast(d.public?`@${d.name} is now public`:`@${d.name} is now private`); },
  newHandle(b){ go('newHandle',{arg:b.dataset.d}); },
  nhOwner(b){ const el=stage.querySelector('.screen:not(.leave)'); el._owner=b.dataset.v; el.querySelectorAll('[data-act="nhOwner"]').forEach(x=>x.setAttribute('aria-pressed',x.dataset.v===el._owner)); $('#nhOther',el).hidden = el._owner!=='other'; el._chk(); },
  createHandle(b){ const el=stage.querySelector('.screen:not(.leave)'); const n=b.dataset.d, v=$('#nhIn',el).value, owner=el._owner==='me'?'me':$('#nhTo',el).value.trim();
    startTx({title:'Create handle', img:'fio', sym:'FIO', dec:2, amount:HANDLE_FEE, px:FIO_PX, from:myHandle(), fromAddr:chainAddr('FIO Chain'), to:'FIO Chain', contract:true, toAddr:'fio.address · regaddress', net:'FIO Chain', feeBase:0,
      action:`Register <span class="handle">${esc(v)}@${esc(n)}</span>${owner==='me'?'':' for '+esc(owner)}`,
      exec(){ const d=S.domains.find(x=>x.name===n); d.handles.push({name:v, owner}); asset('fio').bal-=HANDLE_FEE; addAct({kind:'handle', who:`${v}@${n}`, sym:'FIO', amount:null, memo: owner==='me'?'For me':'Issued to '+owner, net:'FIO Chain'});
        hist = hist.filter(h=>!['newHandle','owned','domain','tx'].includes(h.name)); go('domain',{arg:n,replace:true,dir:'back'}); setTimeout(()=>{ toast(`${v}@${n} created`); confetti(); }, 350); } }); },
  setPrimary(b){ S.primary=b.dataset.h; toast(`${S.primary} is now primary`); refresh(); },
  wrapDomain(b){ const d=S.domains.find(x=>x.name===b.dataset.d);
    if (d.wrapped){ faceId('Approve unwrap', ()=>{ d.wrapped=false; refresh(); toast(`@${d.name} is back on FIO Chain`); }); return; }
    openSheet(`<h2>Wrap @${esc(d.name)} to Polygon</h2><p class="small mt-12">The FIO Bridge locks your domain on FIO Chain and mints the same domain as an NFT on Polygon, so you can list it on NFT marketplaces. Your handles keep working.</p>
      <label class="label mt-20" for="polAddr" style="display:block">Polygon address</label><div class="field mt-8"><input id="polAddr" value="0x7850…cF4B" spellcheck="false"></div>
      <div class="glass list mt-16" style="padding:2px 18px"><div class="kv"><span>Bridge</span><span>FIO Bridge oracles</span></div><div class="kv"><span>Arrives as</span><span>FIO Domain NFT</span></div></div>
      <button class="btn primary mt-20" data-act="confirmWrap" data-d="${esc(d.name)}">${ic('layers',20)}Wrap domain</button>`); },
  confirmWrap(b){ closeSheet(); faceId('Approve wrap', ()=>{ const d=S.domains.find(x=>x.name===b.dataset.d); d.wrapped=true; refresh(); toast(`@${d.name} wrapped to Polygon`); confetti(); }); },
  renewDomain(b){ const d=S.domains.find(x=>x.name===b.dataset.d); openSheet(`<h2>Renew @${esc(d.name)}</h2><p class="small mt-12">Adds one year. Renews ${esc(d.expires)} today.</p>
    <div class="glass list mt-16" style="padding:2px 18px"><div class="kv"><span>Renewal · 1 year</span><span class="num">${RENEW_FEE} FIO</span></div><div class="kv"><span>FIO balance</span><span class="num">${amt(asset('fio').bal,2)} FIO</span></div></div>
    <button class="btn primary mt-20" data-act="confirmRenew" data-d="${esc(d.name)}" ${asset('fio').bal<RENEW_FEE?'disabled':''}>Renew for ${RENEW_FEE} FIO</button>`); },
  confirmRenew(b){ closeSheet(); faceId('Approve renewal', ()=>{ const d=S.domains.find(x=>x.name===b.dataset.d); asset('fio').bal-=RENEW_FEE; const [m,y]=d.expires.split(' '); d.expires=`${m} ${+y+1}`; refresh(); toast(`Renewed to ${d.expires}`); }); },
  transferDomain(b){ openSheet(`<h2>Transfer @${esc(b.dataset.d)}</h2><p class="small mt-12">The new owner gets full control of the domain and the right to manage its handles. This can't be undone.</p>
    <label class="label mt-20" for="trTo" style="display:block">New owner</label><div class="field mt-8"><input id="trTo" placeholder="name@domain or FIO public key" spellcheck="false" autocapitalize="off"></div>
    <button class="btn primary mt-20" data-act="confirmTransfer" data-d="${esc(b.dataset.d)}">Transfer domain</button>`); },
  confirmTransfer(b){ const to=$('#trTo').value.trim(); if(!to){ $('#trTo').focus(); return; } closeSheet(); faceId('Approve transfer', ()=>{ S.domains=S.domains.filter(x=>x.name!==b.dataset.d); toast(`@${b.dataset.d} sent to ${to}`); hist=[]; go('domains',{noHist:true,dir:'back'}); }); },
  connectMM(){ openSheet(`<div class="stack gap-16" style="align-items:center;text-align:center">
      <div class="row gap-12" style="justify-content:center"><span class="fiocoin" style="width:56px;height:56px;border-radius:28px"><img src="${IMG.fmark}" alt=""></span>
        <span class="row gap-4" aria-hidden="true"><i style="width:5px;height:5px;border-radius:3px;background:var(--lilac)"></i><i style="width:5px;height:5px;border-radius:3px;background:var(--lilac);opacity:.6"></i><i style="width:5px;height:5px;border-radius:3px;background:var(--lilac);opacity:.3"></i></span>
        <span style="width:56px;height:56px;border-radius:28px;background:#fff;display:flex;align-items:center;justify-content:center"><img src="${IMG.metamask}" alt="MetaMask" style="width:42px;height:42px"></span></div>
      <h2>Connect with MetaMask</h2><p class="small">Use FIO with the wallet you already have. No new account or password.</p></div>
    <div class="glass list mt-20" style="padding:4px 18px" id="mmBody">
      <div class="kv"><span>FIO will be able to</span><span></span></div>
      <div class="row gap-12" style="min-height:48px">${ic('eye',18,2,'#B9A6FA')}<span style="font-size:14px">See your account address</span></div>
      <div class="row gap-12" style="min-height:48px">${ic('layers',18,2,'#B9A6FA')}<span style="font-size:14px">Add the FIO Snap to manage handles</span></div>
      <div class="row gap-12" style="min-height:48px">${ic('shield',18,2,'#8FF5C9')}<span style="font-size:14px">Never move funds without your approval</span></div>
    </div>
    <div class="row gap-12 mt-20" id="mmBtns"><button class="btn ghost" data-act="closeSheet">Cancel</button><button class="btn primary" data-act="approveMM">Connect</button></div>`); },
  approveMM(){ const body=$('#mmBody'), btns=$('#mmBtns');
    btns.innerHTML = `<button class="btn ghost" disabled style="opacity:1"><span class="spinner"></span>Waiting for MetaMask…</button>`;
    setTimeout(()=>{ body.innerHTML = `<div class="steps" style="padding:6px 0">${['Account connected','FIO Snap installed'].map(t=>`<div class="st"><span class="ic">${ic('check',14,3,'#06231A')}</span>${t}</div>`).join('')}</div>`;
      const st=[...body.querySelectorAll('.st')]; st.forEach((x,i)=>{ setTimeout(()=>x.classList.add('on','done'), 150+i*450); });
      setTimeout(()=>{ btns.innerHTML = `<div class="pill ok" style="height:44px;width:100%;justify-content:center;border-radius:22px;font-size:14px"><img src="${IMG.metamask}" alt="" style="width:22px;height:22px">Connected · 0x7850…cF4B</div>`; }, 1100);
      setTimeout(()=>{ S.via='mm'; closeSheet(); hist=[{name:'welcome'}]; go('claim',{noHist:true}); }, 2000);
    }, reduce?100:1100); },
  toggleFace(b){ S.faceId=b.checked; toast(S.faceId?'Face ID on':'Face ID off'); },
  resetDemo(){ openSheet(`<h2>Reset demo?</h2><p class="small mt-12">This clears your handle, domains and activity, and restores the demo balances.</p><div class="row gap-12 mt-20"><button class="btn ghost" data-act="closeSheet">Cancel</button><button class="btn primary" data-act="confirmReset">Reset</button></div>`); },
  confirmReset(){ S=freshState(); hist=[]; closeSheet(true); go('splash',{noHist:true,dir:'fade'}); }
};

device.addEventListener('click', e=>{
  const t = e.target.closest('[data-act],[data-go],[data-tab],[data-tabgo]'); if (!t || !device.contains(t)) return;
  if (t.matches('input.switch') && !t.dataset.act) return;
  if (t.dataset.tab){ if (cur.name!==t.dataset.tab){ hist=[]; go(t.dataset.tab,{noHist:true,dir:'fade'}); } return; }
  if (t.dataset.tabgo){ hist=[]; go(t.dataset.tabgo,{noHist:true,dir:'fade'}); return; }
  if (t.dataset.go){ go(t.dataset.go,{arg:t.dataset.arg}); return; }
  const f = A[t.dataset.act]; if (f) f(t, e);
});
device.addEventListener('change', e=>{ const t=e.target; if (t.dataset && t.dataset.link){ S.linked[t.dataset.link]=t.checked; toast(`${CHAINS.find(c=>c.id===t.dataset.link).name} ${t.checked?'linked to':'unlinked from'} ${myHandle()}`, t.checked?'link':'x'); } });
device.addEventListener('keydown', e=>{ if (e.key==='Escape' && sheetEl) closeSheet(); });

[device, stage].forEach(n=>n.addEventListener('scroll', ()=>{ if (n.scrollTop||n.scrollLeft){ n.scrollTop=0; n.scrollLeft=0; } }));
// Android back button: returns true when the app handled it
window.fioBack = () => {
  if (stage.querySelector('.fid')) return true;
  if (sheetEl){ closeSheet(); return true; }
  if (!cur || cur.name==='splash') return false;
  if (hist.length){ back(); return true; }
  if (tabScreens.includes(cur.name) && cur.name!=='home'){ go('home',{noHist:true,dir:'fade'}); return true; }
  return false;
};
go('splash',{noHist:true,dir:'fade'});
})();
</script>
