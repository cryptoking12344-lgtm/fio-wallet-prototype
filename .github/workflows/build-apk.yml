name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build the offline web page
        run: python3 web/build.py

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Name the APK
        run: cp app/build/outputs/apk/debug/app-debug.apk FIO-Wallet-Prototype.apk

      - uses: actions/upload-artifact@v4
        with:
          name: FIO-Wallet-Prototype
          path: FIO-Wallet-Prototype.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: FIO Wallet Prototype · build ${{ github.run_number }}
          make_latest: true
          files: FIO-Wallet-Prototype.apk
          body: |
            Demo build of the FIO Wallet prototype. Demo balances only, no real funds.

            Install: download FIO-Wallet-Prototype.apk on your Android phone and open it.
            You may need to allow installs from your browser or file manager.
